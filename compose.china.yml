name: frontdesk-cn

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: frontdesk
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk -d frontdesk"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://frontdesk:${POSTGRES_PASSWORD}@db:5432/frontdesk
      DIRECT_URL: postgresql://frontdesk:${POSTGRES_PASSWORD}@db:5432/frontdesk
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY}
      LLM_INPUT_PRICE: ${LLM_INPUT_PRICE:-0.27}
      LLM_OUTPUT_PRICE: ${LLM_OUTPUT_PRICE:-1.10}
      APP_CORS_ALLOWED_ORIGINS: https://frontdesk.livegrc.chat
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      private:
      ingress:
        aliases: [frontdesk-cn-api]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on: [api]
    networks:
      ingress:
        aliases: [frontdesk-cn-web]

volumes:
  postgres-data:

networks:
  private:
  ingress:
    external: true
    name: heju-ingress
